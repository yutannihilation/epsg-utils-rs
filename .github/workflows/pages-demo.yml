name: Web Demo Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm package
        run: wasm-pack build web/wasm --release --target web --out-dir ../pkg --out-name epsg_utils_web

      - name: Prepare site artifact
        run: |
          rm -rf web-dist
          mkdir -p web-dist
          cp web/index.html web-dist/
          cp web/main.js web-dist/
          cp web/styles.css web-dist/
          cp -R web/pkg web-dist/pkg

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

      - id: deployment
        uses: actions/deploy-pages@v5
